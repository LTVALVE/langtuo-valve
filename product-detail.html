.logo{display:flex;align-items:center;gap:10px;font-size:1.15rem;font-weight:700;color:var(--text);white-space:nowrap}
.logo-icon{width:36px;height:36px;flex-shrink:0}
.nav{display:flex;align-items:center;gap:32px}
.nav a{font-size:.9rem;color:var(--text2);transition:var(--transition);font-weight:500}
.nav a:hover{color:var(--accent)}
.header-actions{display:flex;align-items:center;gap:16px}
.lang-toggle{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px;cursor:pointer}
.lang-btn{background:none;border:none;cursor:pointer;padding:6px 14px;font-size:.82rem;font-weight:600;color:var(--text3);border-radius:16px;transition:var(--transition)}
.lang-btn.active{background:var(--accent);color:#fff}
.menu-toggle{display:none;background:none;border:none;cursor:pointer;flex-direction:column;gap:5px;padding:6px}
.menu-toggle span{display:block;width:22px;height:2px;background:var(--text);border-radius:2px}

.breadcrumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:28px 0 0;font-size:.85rem;color:var(--text3)}
.breadcrumb a{color:var(--text2);transition:var(--transition)}
.breadcrumb a:hover{color:var(--accent)}
.breadcrumb .cur{color:var(--text);font-weight:500}

.detail-img-wrap{background:linear-gradient(160deg,#eef3fa 0%,#f7fafd 55%,#e4ecf5 100%);border:2px solid #d4deec;border-radius:12px;display:flex;align-items:center;justify-content:center;min-height:420px;overflow:hidden;cursor:zoom-in;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
.detail-img-wrap img{max-width:100%;max-height:380px;object-fit:contain;transition:transform .3s}
.detail-img-wrap:hover img{transform:scale(1.03)}

.detail-title{font-size:1.7rem;font-weight:700;line-height:1.35;margin-bottom:8px}
.detail-subs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.sub-chip{font-size:.8rem;padding:5px 14px;border-radius:4px;background:var(--glow);color:var(--accent);font-weight:600}
.detail-desc{font-size:1rem;color:var(--text2);line-height:1.85;margin-bottom:24px;text-align:justify}
.detail-cta{display:flex;gap:16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 30px;font-size:.92rem;font-weight:600;border-radius:var(--radius);cursor:pointer;transition:var(--transition);border:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);box-shadow:0 0 24px var(--glow)}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}

/* ===== Info blocks ===== */
.blocks{margin-top:36px;display:flex;flex-direction:column;gap:36px}
.block{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;box-shadow:var(--shadow)}
.block h3{font-size:1.15rem;font-weight:700;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border);position:relative}
.block h3::after{content:'';position:absolute;left:0;bottom:-1px;width:56px;height:2px;background:var(--accent)}
.specs-table{width:100%;border-collapse:collapse}

.specs-table th{background:var(--glow);color:var(--accent);font-weight:600;width:32%}
.specs-table td{color:var(--text2)}
.specs-table tr:last-child th,.specs-table tr:last-child td{border-bottom:none}
.block p.intro{color:var(--text2);font-size:.92rem;line-height:1.8}

.feat-item:hover,.app-item:hover{border-color:var(--accent);color:var(--text)}
.feat-item::before{content:'\2714';color:var(--accent);font-size:.8rem;flex-shrink:0}
.app-item::before{content:'\25CF';color:var(--accent);font-size:.6rem;flex-shrink:0}

/* ===== Inquiry ===== */
.inquiry{background:linear-gradient(135deg,var(--card) 0%,var(--bg2) 100%);border:1px solid var(--border);border-radius:16px;padding:40px;text-align:center;margin-top:40px}
.inquiry h3{font-size:1.3rem;margin-bottom:12px}
.inquiry p{color:var(--text2);margin-bottom:24px}

/* ===== Footer ===== */
.footer{background:var(--bg2);border-top:1px solid var(--border);padding:48px 0 28px;margin-top:8px}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:40px}
.footer-logo{display:flex;align-items:center;gap:10px;font-size:1.05rem;font-weight:700;color:var(--text);margin-bottom:14px}
.footer-desc{font-size:.85rem;color:var(--text3);line-height:1.75}
.footer-col h4{font-size:.95rem;color:var(--text);margin-bottom:14px}
.footer-col a{display:block;font-size:.85rem;color:var(--text3);padding:5px 0;transition:var(--transition)}
.footer-col a:hover{color:var(--accent)}
.footer-bottom{border-top:1px solid var(--border);margin-top:32px;padding-top:22px;text-align:center;font-size:.8rem;color:var(--text3)}

/* ===== Lightbox ===== */
.lb{position:fixed;inset:0;z-index:999;background:rgba(3,9,20,.94);display:none;align-items:center;justify-content:center;padding:30px}
.lb.open{display:flex}
.lb img{max-width:min(92vw,1300px);max-height:86vh;object-fit:contain;border-radius:10px;cursor:zoom-in;transition:transform .2s}
.lb img.zoomed{transform:scale(1.4)}
.lb-close{position:absolute;top:18px;right:24px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10}
.lb-caption{margin-top:12px;color:#d8e6f8;font-size:.95rem;text-align:center;max-width:80vw}

  .menu-toggle{display:flex}
}
@media(max-width:640px){
  .footer-grid{grid-template-columns:1fr}
  .detail-title{font-size:1.3rem}
  .block{padding:22px}
}

.nav a:hover{color:var(--accent)}
.header-actions{display:flex;align-items:center;gap:16px}
.lang-toggle{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px;cursor:pointer}
.lang-btn{background:none;border:none;cursor:pointer;padding:6px 14px;font-size:.82rem;font-weight:600;color:var(--text3);border-radius:16px;transition:var(--transition)}
.lang-btn.active{background:var(--accent);color:#fff}
.menu-toggle{display:none;background:none;border:none;cursor:pointer;flex-direction:column;gap:5px;padding:6px}
.menu-toggle span{display:block;width:22px;height:2px;background:var(--text);border-radius:2px}

/* ===== Breadcrumb ===== */
.breadcrumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:28px 0 0;font-size:.85rem;color:var(--text3)}
.breadcrumb a{color:var(--text2);transition:var(--transition)}
.breadcrumb a:hover{color:var(--accent)}
.breadcrumb .cur{color:var(--text);font-weight:500}

/* ===== Detail ===== */
.detail-wrap{padding:32px 0 72px}
.detail-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;box-shadow:var(--shadow)}
.detail-img-wrap{background:linear-gradient(160deg,#eef3fa 0%,#f7fafd 55%,#e4ecf5 100%);border:2px solid #d4deec;border-radius:12px;display:flex;align-items:center;justify-content:center;min-height:420px;overflow:hidden;cursor:zoom-in;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
.detail-img-wrap img{max-width:100%;max-height:380px;object-fit:contain;transition:transform .3s}
.detail-img-wrap:hover img{transform:scale(1.03)}
.zoom-hint{position:absolute;bottom:14px;right:16px;font-size:.75rem;color:var(--text3);background:rgba(255,255,255,.85);padding:4px 10px;border-radius:20px;border:1px solid var(--border)}
.detail-title{font-size:1.7rem;font-weight:700;line-height:1.35;margin-bottom:8px}
.detail-subs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.sub-chip{font-size:.8rem;padding:5px 14px;border-radius:4px;background:var(--glow);color:var(--accent);font-weight:600}
.detail-desc{font-size:1rem;color:var(--text2);line-height:1.85;margin-bottom:24px;text-align:justify}
.detail-cta{display:flex;gap:16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 30px;font-size:.92rem;font-weight:600;border-radius:var(--radius);cursor:pointer;transition:var(--transition);border:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);box-shadow:0 0 24px var(--glow)}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}

/* ===== Info blocks ===== */
.blocks{margin-top:36px;display:flex;flex-direction:column;gap:36px}
.block{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;box-shadow:var(--shadow)}
.block h3{font-size:1.15rem;font-weight:700;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border);position:relative}
.block h3::after{content:'';position:absolute;left:0;bottom:-1px;width:56px;height:2px;background:var(--accent)}
.specs-table{width:100%;border-collapse:collapse}
.specs-table th,.specs-table td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--border);font-size:.9rem}
.specs-table th{background:var(--glow);color:var(--accent);font-weight:600;width:32%}
.specs-table td{color:var(--text2)}
.specs-table tr:last-child th,.specs-table tr:last-child td{border-bottom:none}
.block p.intro{color:var(--text2);font-size:.92rem;line-height:1.8}
.feat-grid,.app-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.feat-item,.app-item{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;font-size:.9rem;color:var(--text2);transition:var(--transition)}
.feat-item:hover,.app-item:hover{border-color:var(--accent);color:var(--text)}
.feat-item::before{content:'\2714';color:var(--accent);font-size:.8rem;flex-shrink:0}
.app-item::before{content:'\25CF';color:var(--accent);font-size:.6rem;flex-shrink:0}

/* ===== Inquiry ===== */
.inquiry{background:linear-gradient(135deg,var(--card) 0%,var(--bg2) 100%);border:1px solid var(--border);border-radius:16px;padding:40px;text-align:center;margin-top:40px}
.inquiry h3{font-size:1.3rem;margin-bottom:12px}
.inquiry p{color:var(--text2);margin-bottom:24px}

/* ===== Footer ===== */
.footer{background:var(--bg2);border-top:1px solid var(--border);padding:48px 0 28px;margin-top:8px}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:40px}
.footer-logo{display:flex;align-items:center;gap:10px;font-size:1.05rem;font-weight:700;color:var(--text);margin-bottom:14px}
.footer-desc{font-size:.85rem;color:var(--text3);line-height:1.75}
.footer-col h4{font-size:.95rem;color:var(--text);margin-bottom:14px}
.footer-col a{display:block;font-size:.85rem;color:var(--text3);padding:5px 0;transition:var(--transition)}
.footer-col a:hover{color:var(--accent)}
.footer-bottom{border-top:1px solid var(--border);margin-top:32px;padding-top:22px;text-align:center;font-size:.8rem;color:var(--text3)}

/* ===== Lightbox ===== */
.lb{position:fixed;inset:0;z-index:999;background:rgba(3,9,20,.94);display:none;align-items:center;justify-content:center;padding:30px}
.lb.open{display:flex}
.lb img{max-width:min(92vw,1300px);max-height:86vh;object-fit:contain;border-radius:10px;cursor:zoom-in;transition:transform .2s}
.lb img.zoomed{transform:scale(1.4)}
.lb-close{position:absolute;top:18px;right:24px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10}
.lb-caption{margin-top:12px;color:#d8e6f8;font-size:.95rem;text-align:center;max-width:80vw}

/* ===== Responsive ===== */
@media(max-width:900px){
  .detail-grid{grid-template-columns:1fr;padding:24px}
  .detail-img-wrap{min-height:280px}
  .feat-grid,.app-grid{grid-template-columns:1fr}
  .footer-grid{grid-template-columns:1fr 1fr}
  .nav{display:none;position:absolute;top:64px;left:0;right:0;background:var(--bg);border-bottom:1px solid var(--border);flex-direction:column;padding:16px 24px;gap:14px}
  .nav.open{display:flex}
  .menu-toggle{display:flex}
}
@media(max-width:640px){
  .footer-grid{grid-template-columns:1fr}
  .detail-title{font-size:1.3rem}
  .block{padding:22px}
}

    specTitle:'Technical Specifications',featTitle:'Product Features',appTitle:'Applications',
    inqTitle:'Need detailed specifications and quotation?',inqDesc:'Contact our technical team for selection advice, lead time and pricing support.',inqBtn:'Contact Us',
    footerDesc:'Shenzhen Langtuo Valve Co., Ltd — Professional industrial valve supply chain service provider for global industrial customers.',
    fNav1:'Quick Links',fNav2:'Products',fNav3:'Selection Guide',
    brand:'Shenzhen Langtuo Valve Co., Ltd.',allRights:'All Rights Reserved',
    cr:'© {y} Shenzhen Langtuo Valve Co., Ltd. All Rights Reserved',
    notFound:'Product not found',
    home:'Home',products:'Products',detail:'Product Detail'
  }
};

function qs(n){var m=(location.search||'').match(new RegExp('[?&]'+n+'=([^&]+)'));return m?decodeURIComponent(m[1].replace(/\+/g,' ')):'';}

function setLang(l){
  lang=l;
  document.querySelectorAll('.lang-btn').forEach(function(b){b.classList.toggle('active',b.dataset.lang===l);});
  document.documentElement.lang = l==='zh'?'zh-CN':'en';
  document.querySelectorAll('[data-i18n]').forEach(function(el){var k=el.getAttribute('data-i18n');if(i18n[lang][k])el.textContent=i18n[lang][k];});
  document.getElementById('copyright').textContent = i18n[lang].cr.replace('{y}',new Date().getFullYear());
  render();
}

function findProduct(name){
  var list = products[lang];
  for(var s=0;s<list.length;s++){
    var ser=list[s];
    for(var u=0;u<ser.subcategories.length;u++){
      var sub=ser.subcategories[u];
      for(var p=0;p<sub.products.length;p++){
        if(sub.products[p].name===name){
          return {series:ser,idx:s,sub:sub,subIdx:u,prod:sub.products[p],prodIdx:p};
        }
      }
    }
  }
  return null;
}

function splitLines(str){return (str||'').split('\n').map(function(t){return t.trim();}).filter(Boolean);}
function splitCn(str){return (str||'').split(/[;；]/).map(function(t){return t.trim();}).filter(Boolean);}
function splitApp(str){return (str||'').split(/[,，、]/).map(function(t){return t.trim();}).filter(Boolean);}

function render(){
  var t=i18n[lang];
  var name=qs('product');
  var found=findProduct(name);
  var bc=document.getElementById('breadcrumb');
  var title=document.getElementById('detailTitle');

  if(!found){
    title.textContent=t.notFound;
    bc.innerHTML='<a href="index.html">'+t.home+'</a><span>&#8250;</span><span class="cur">'+t.notFound+'</span>';
    document.title = t.notFound+' - LANGTUO VALVE';
    return;
  }
var p=found.prod;
  document.title = p.name+' | '+t.detail+' - LANGTUO VALVE';
  try{
    var oldLd=document.getElementById('product-jsonld');
    if(oldLd)oldLd.remove();
    var sc=document.createElement('script');
    sc.type='application/ld+json';sc.id='product-jsonld';
    var imgUrl=p.img?('https://site.langtuovalve.com/'+p.img):'https://site.langtuovalve.com/images/factory_01.jpg';
    sc.textContent=JSON.stringify({
      "@context":"https://schema.org/",
      "@type":"Product",
      "name":p.name,
      "image":imgUrl,
      "description":p.desc||'',
      "brand":{"@type":"Brand","name":"Langtuo Valve"},
      "manufacturer":{"@type":"Organization","name":"Shenzhen Langtuo Valve Co., Ltd","url":"https://site.langtuovalve.com"},
      "category":found.series.name+' - '+found.sub.name,
      "offers":{"@type":"Offer","url":"https://site.langtuovalve.com/product-detail.html?product="+encodeURIComponent(p.name),"availability":"https://schema.org/InStock","priceCurrency":"USD","price":"0.00","priceValidUntil":""},
      "additionalProperty":(p.specs||'').split('\n').filter(function(l){return l&&l.indexOf(':')>0;}).map(function(l){var sp=l.split(/[:：]/,2);return {"@type":"PropertyValue","name":sp[0].trim(),"value":(sp[1]||'').trim()};}).slice(0,8)
    });
    document.head.appendChild(sc);
  }catch(e){}

  bc.innerHTML =
    '<a href="index.html">'+t.home+'</a><span>&#8250;</span>'+
    '<a href="products.html">'+t.products+'</a><span>&#8250;</span>'+
    '<a href="products.html#series/'+found.idx+'">'+found.series.name+'</a><span>&#8250;</span>'+
    '<a href="products.html#series/'+found.idx+'/'+found.subIdx+'">'+found.sub.name+'</a><span>&#8250;</span>'+
    '<span class="cur">'+p.name+'</span>';

  title.textContent=p.name;
  document.getElementById('detailSubs').innerHTML =
    '<span class="sub-chip">'+found.series.name+'</span><span class="sub-chip">'+found.sub.name+'</span>';
  document.getElementById('detailDesc').textContent = p.desc||'';

  var imgWrap=document.getElementById('imgWrap');
  if(p.img){
    var ig=document.createElement('img');
    ig.src=p.img;ig.alt=p.name;ig.decoding='async';
    ig.onerror=function(){imgWrap.innerHTML='<span style="color:var(--text3)">'+t.notFound+'</span><span class="zoom-hint">'+t.zoomHint+'</span>';};
    ig.onclick=function(){
      document.getElementById('lbImg').src=p.img;
      document.getElementById('lbImg').classList.remove('zoomed');
      document.getElementById('lbCaption').textContent=p.name;
      document.getElementById('lightbox').classList.add('open');
    };
    imgWrap.insertBefore(ig,imgWrap.firstChild);
  }

  var specs=splitLines(p.specs);
  var rows='';
  for(var i=0;i<specs.length;i++){
    var m=specs[i].match(/^([^:：]+)[:：]\s*(.+)$/);
    if(m){rows+='<tr><th>'+m[1]+'</th><td>'+m[2]+'</td></tr>';}
    else{rows+='<tr><td colspan="2">'+specs[i]+'</td></tr>';}
  }
  document.getElementById('specTable').innerHTML=rows;
  document.getElementById('specBlock').style.display=rows?'':'none';

  var feats=splitCn(p.features);
  document.getElementById('featIntro').textContent = p.featuresDesc||'';
  document.getElementById('featIntro').style.display=(p.featuresDesc)?'':'none';
  document.getElementById('featGrid').innerHTML = feats.map(function(f){return '<div class="feat-item" title="'+f+'">'+f+'</div>';}).join('');
  document.getElementById('featBlock').style.display=feats.length?'':'none';

  var apps=splitApp(p.applications);
  document.getElementById('appGrid').innerHTML = apps.map(function(a){return '<div class="app-item">'+a+'</div>';}).join('');
  document.getElementById('appBlock').style.display=apps.length?'':'none';

  document.getElementById('ctaInquiry').href='contact.html?lang='+lang+'&product='+encodeURIComponent(p.name);
  document.getElementById('inquirySubj') && (document.getElementById('inquirySubj').textContent=p.name);
}

function closeLb(){document.getElementById('lightbox').classList.remove('open');}

document.addEventListener('click',function(e){
  var a=e.target.closest('a');
  if(a && a.href && /\.html/.test(a.getAttribute('href')||'')){
    var h=a.getAttribute('href');
    if(h.indexOf('lang=')===-1){
      var hash='';var qidx=h.indexOf('#');
      if(qidx!==-1){hash=h.slice(qidx);h=h.slice(0,qidx);}
      a.href=h+(h.indexOf('?')===-1?'?':'&')+'lang='+lang+hash;
    }
  }
},true);

/* 页脚产品链接 */
(function(){
  var t=i18n[lang];
  var list=products[lang];
  var links=[document.getElementById('fLink1'),document.getElementById('fLink2'),document.getElementById('fLink3'),document.getElementById('fLink4')];
  ([0,1,2,4]).forEach(function(ix,i){if(list[ix]&&links[i]){links[i].textContent=list[ix].name;links[i].href='products.html#series/'+ix;}});
  setLang(qs('lang')||'zh');
})();
</script>
</body>
</html>
